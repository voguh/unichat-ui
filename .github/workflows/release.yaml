name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  ZBELL_REGISTRY: https://zbell.voguh.me

jobs:
  prepare-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check version consistency
        run: |
          export PACKAGE_VERSION="$(jq -r '.version' package.json)"
          TAG_NAME="${{ github.ref_name }}"
          if [ "$PACKAGE_VERSION" != "$TAG_NAME" ]; then
            echo "Error: The version in package.json ($PACKAGE_VERSION) does not match the release tag ($TAG_NAME)."
            exit 1
          fi

      - name: Check version not published
        run: |
          PACKAGE_NAME="$(jq -r '.name' package.json)"
          VERSION="${{ github.ref_name }}"
          if npm view "$PACKAGE_NAME@$VERSION" version --registry "$ZBELL_REGISTRY" > /dev/null 2>&1; then
            echo "Error: $PACKAGE_NAME@$VERSION is already published to zBell."
            exit 1
          fi

  package:
    needs: [prepare-release]
    uses: ./.github/workflows/package.yaml

  publish:
    runs-on: ubuntu-24.04
    needs: [package]
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Download package artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: release

      - name: Prepare release assets
        run: |
          export VERSION="${{ github.ref_name }}"
          mv "release/voguh-unichat-ui-$VERSION.tgz" "release/unichat-ui-$VERSION.tgz"
          for file in release/*; do
            if [ -f "$file" ]; then
              (cd "$(dirname "$file")" && sha256sum "$(basename "$file")" > "$(basename "$file").sha256")
            fi
          done

      - name: Create draft Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export VERSION="${{ github.ref_name }}"
          if [[ "$(gh release view "$VERSION" --json isDraft --jq .isDraft 2> /dev/null)" == "true" ]]; then
            gh release delete "$VERSION" --yes
          fi
          if [[ "$VERSION" == *"-"* || "$VERSION" == *"+"* ]]; then
            gh release create "$VERSION" release/* --draft --prerelease
          else
            gh release create "$VERSION" release/* --draft
          fi

      - name: Publish to zbell
        run: |
          export VERSION="${{ github.ref_name }}"
          PACKAGE_NAME="$(jq -r '.name' package.json)"
          if npm view "$PACKAGE_NAME@$VERSION" version --registry "$ZBELL_REGISTRY" > /dev/null 2>&1; then
            echo "$PACKAGE_NAME@$VERSION is already published to zBell."
            exit 0
          fi
          TOKEN=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$ZBELL_REGISTRY" | jq -r .value)
          echo "::add-mask::$TOKEN"
          if ! npm publish "./release/unichat-ui-$VERSION.tgz" --registry "$ZBELL_REGISTRY" --tag "latest" "--${ZBELL_REGISTRY#*:}/:_authToken=$TOKEN" --logs-dir npm-logs; then
            cat npm-logs/*.log
            exit 1
          fi

      - name: Publish Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false
