name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

defaults:
  run:
    shell: bash

env:
  ZBELL_REGISTRY: https://zbell.voguh.me

jobs:
  prepare-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check version consistency
        run: |
          export PACKAGE_VERSION="$(jq -r '.version' package.json)"
          TAG_NAME="${{ github.ref_name }}"
          if [ "$PACKAGE_VERSION" != "$TAG_NAME" ]; then
            echo "Error: The version in package.json ($PACKAGE_VERSION) does not match the release tag ($TAG_NAME)."
            exit 1
          fi

      - name: Check version not published
        run: |
          PACKAGE_NAME="$(jq -r '.name' package.json)"
          VERSION="${{ github.ref_name }}"
          if npm view "$PACKAGE_NAME@$VERSION" version --registry "$ZBELL_REGISTRY" > /dev/null 2>&1; then
            echo "Error: $PACKAGE_NAME@$VERSION is already published to zBell."
            exit 1
          fi

  publish:
    runs-on: ubuntu-24.04
    needs: [prepare-release]
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: ./pnpmw install --frozen-lockfile

      - name: Build
        run: ./pnpmw build

      - name: Pack package
        run: |
          export VERSION="${{ github.ref_name }}"
          mkdir -p release
          npm pack . --pack-destination release
          mv "release/voguh-unichat-ui-$VERSION.tgz" "release/unichat-ui-$VERSION.tgz"
          for file in release/*; do
            if [ -f "$file" ]; then
              (cd "$(dirname "$file")" && sha256sum "$(basename "$file")" > "$(basename "$file").sha256")
            fi
          done

      - name: Create and upload Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export VERSION="${{ github.ref_name }}"
          if [[ "$VERSION" == *"-"* || "$VERSION" == *"+"* ]]; then
            gh release create "$VERSION" release/* --prerelease
          else
            gh release create "$VERSION" release/*
          fi

      - name: Publish to zbell
        run: |
          TOKEN=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$ZBELL_REGISTRY" | jq -r .value)
          echo "::add-mask::$TOKEN"
          if ! npm publish --registry "$ZBELL_REGISTRY" --tag "latest" "--${ZBELL_REGISTRY#*:}/:_authToken=$TOKEN" --logs-dir npm-logs; then
            cat npm-logs/*.log
            exit 1
          fi
