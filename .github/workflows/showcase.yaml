name: Showcase

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  showcase:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: ./pnpmw install --frozen-lockfile

      - name: Build library
        run: ./pnpmw build

      - name: Sync library into the showcase
        run: ./pnpmw install --offline --frozen-lockfile

      - name: Run lint
        run: ./pnpmw --filter @voguh/unichat-ui-showcase lint

      - name: Run typecheck
        run: ./pnpmw --filter @voguh/unichat-ui-showcase typecheck

      - name: Build showcase
        env:
          NODE_ENV: production
        run: ./pnpmw --filter @voguh/unichat-ui-showcase exec rspack build
